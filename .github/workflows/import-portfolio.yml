name: Import Aqel portfolio
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy public credentials and PDFs
        run: |
          set -euo pipefail
          source_url="https://aqel-qahtan-credentials.bali0411.chatgpt.site"
          curl -fsSL "$source_url/" -o index.html
          mkdir -p certificates
          grep -oE 'certificates/[a-z0-9-]+[.]pdf' index.html | sort -u > pdf_paths.txt
          count=$(wc -l &lt; pdf_paths.txt)
          test "$count" -eq 22
          while IFS= read -r path; do
            curl -fsSL "$source_url/$path" -o "$path"
            echo "Saved $path"
          done &lt; pdf_paths.txt
          rm pdf_paths.txt
          touch .nojekyll
      - name: Commit files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html certificates .nojekyll
          git diff --cached --quiet || git commit -m "Publish Aqel portfolio"
          git push
